<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera Runner</title>
  <style>
    :root {
      --bg: #050510;
      --surface: rgba(18, 18, 36, 0.78);
      --surface-solid: #121224;
      --primary: #00d2ff;
      --secondary: #ff4ecd;
      --accent: #ffd700;
      --foreground: #ffffff;
      --muted: #aeb8e8;
      --border: rgba(255,255,255,0.16);
      --ring: rgba(0,210,255,0.65);
      --shadow: 0 12px 40px rgba(0,0,0,0.55);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--foreground);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    #gameCanvas { display: block; width: 100vw; height: 100vh; }
    #camPreview {
      position: absolute; top: 20px; left: 20px;
      width: 220px; height: 165px; border-radius: 18px;
      border: 2px solid var(--border); object-fit: cover;
      transform: scaleX(-1); background: #000;
      box-shadow: var(--shadow);
    }
    #poseOverlay {
      position: absolute; top: 20px; left: 20px;
      width: 220px; height: 165px; border-radius: 18px;
      transform: scaleX(-1); pointer-events: none;
    }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column;
      justify-content: space-between; padding: 28px;
    }
    #topBar {
      display: flex; justify-content: flex-end; align-items: flex-start;
    }
    #scoreCard {
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 4px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 10px 18px;
      backdrop-filter: blur(8px); box-shadow: var(--shadow);
    }
    #scoreLabel {
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
    }
    #scoreBoard {
      font-size: 38px; font-weight: 900; line-height: 1;
      color: var(--foreground); text-shadow: 0 0 18px var(--primary);
      font-variant-numeric: tabular-nums;
    }
    .overlay {
      position: absolute; inset: 0; pointer-events: auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(5,5,16,0.82); backdrop-filter: blur(10px);
      transition: opacity 0.35s ease;
    }
    #gameOverScreen { opacity: 0; pointer-events: none; }
    .brand {
      display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
    }
    .brandMark {
      width: 56px; height: 56px; border-radius: 16px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 0 24px rgba(0,210,255,0.35);
    }
    .brandMark svg { width: 30px; height: 30px; color: #000; }
    h1 { font-size: 52px; margin-bottom: 6px; letter-spacing: -0.03em; }
    .gradientText {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 { font-size: 44px; margin-bottom: 8px; color: var(--secondary); }
    p { font-size: 17px; max-width: 540px; text-align: center; margin-bottom: 26px; line-height: 1.55; color: var(--muted); }
    .controls {
      display: flex; gap: 18px; margin: 10px 0 28px;
    }
    .control {
      width: 128px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 18px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; backdrop-filter: blur(6px);
    }
    .control svg {
      width: 42px; height: 42px;
      color: var(--primary); filter: drop-shadow(0 0 6px rgba(0,210,255,0.4));
    }
    .label { font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.35; }
    .kbd { font-size: 11px; color: var(--secondary); margin-top: 2px; }
    button {
      padding: 16px 40px; font-size: 18px; font-weight: 800;
      color: #000; cursor: pointer; border: 0; border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      box-shadow: 0 10px 28px rgba(255,78,205,0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 34px rgba(255,78,205,0.45); }
    button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring), 0 14px 34px rgba(255,78,205,0.45); }
    #feedback {
      position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
      font-size: 30px; font-weight: 900; opacity: 0; transition: opacity 0.25s, transform 0.25s;
      color: var(--accent); text-shadow: 0 0 22px rgba(255,215,0,0.55);
      pointer-events: none;
    }
    #feedback.pop { opacity: 1; transform: translateX(-50%) translateY(-10px) scale(1.06); }
    #status {
      position: absolute; top: 198px; left: 24px;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600; color: var(--muted);
      max-width: 210px; line-height: 1.4;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(6px);
    }
    #statusDot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    #status.active #statusDot { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
    #status.warn #statusDot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: rgba(0,210,255,0.12); color: var(--primary); border: 1px solid rgba(0,210,255,0.25);
      margin-bottom: 16px;
    }
    .badge svg { width: 14px; height: 14px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    @media (max-width: 640px) {
      h1 { font-size: 36px; }
      h2 { font-size: 32px; }
      .controls { flex-direction: column; gap: 12px; }
      .control { width: 100%; max-width: 260px; flex-direction: row; justify-content: flex-start; }
      #camPreview, #poseOverlay { width: 140px; height: 105px; top: 12px; left: 12px; border-radius: 12px; }
      #status { top: 126px; left: 12px; max-width: 140px; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <video id="camPreview" autoplay playsinline muted></video>
  <canvas id="poseOverlay" width="220" height="165"></canvas>
  <div id="status"><span id="statusDot"></span><span id="statusText">Waiting for camera...</span></div>

  <div id="ui">
    <div id="topBar">
      <div id="scoreCard">
        <div id="scoreLabel">Score</div>
        <div id="scoreBoard">0</div>
      </div>
    </div>
    <div id="feedback"></div>
  </div>

  <div id="startScreen" class="overlay">
    <div class="brand">
      <div class="brandMark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
      </div>
      <h1 class="gradientText">Camera Runner</h1>
    </div>
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
      Webcam-powered endless runner
    </div>
    <p>Use your body to play. Step back so the camera can see your legs and torso clearly.</p>
    <div class="controls">
      <div class="control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
        <div class="label">Run in place<div class="kbd">drive forward</div></div>
      </div>
      <div class="control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="8 12 12 8 16 12"></polyline><line x1="12" y1="16" x2="12" y2="8"></line></svg>
        <div class="label">Jump<div class="kbd">over barriers</div></div>
      </div>
      <div class="control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 12l-5-5-5 5"></path><path d="M12 19V7"></path><path d="M7 12l5 5 5-5" transform="rotate(180 12 12)"></path></svg>
        <div class="label">Step left / right<div class="kbd">switch lanes</div></div>
      </div>
    </div>
    <button id="startBtn" autofocus>Start Game</button>
  </div>

  <div id="gameOverScreen" class="overlay">
    <h2>Game Over</h2>
    <p id="finalScore">Score: 0</p>
    <button id="restartBtn">Run Again</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
